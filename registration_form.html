<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sports Day Registration</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        .container { max-width: 400px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);}
        h2 { text-align: center; color: #0077b6; }
        label { display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc; }
        button { width: 100%; padding: 10px; margin-top: 20px; background: #0077b6; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #005f8a; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sports Day Registration</h2>
        <form action="#" method="post">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="event">Event:</label>
            <select id="event" name="event" required>
                <option value="">Select an Event</option>
                <option value="100m">100m Sprint</option>
                <option value="relay">Relay Race</option>
                <option value="long_jump">Long Jump</option>
                <option value="football">Football</option>
                <option value="cricket">Cricket</option>
            </select>

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
